version: '3.8'

services: 
  rabbitmq: 
    image: rabbitmq:4-management 
    container_name: infolelang-rabbitmq 
    restart: unless-stopped 
    environment: 
      RABBITMQ_DEFAULT_USER: username 
      RABBITMQ_DEFAULT_PASS: password
    ports: 
      - "5672:5672" 
      - "15672:15672" 
    volumes: 
      - rabbitmq_data:/var/lib/rabbitmq

volumes: 
  rabbitmq_data: 
    external: true